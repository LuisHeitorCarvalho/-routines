<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rotina</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eceef1;
  --ink:#101318;
  --ink-2:#4a515c;
  --ink-3:#949ba6;
  --line:#d7dbe1;
  --accent:#3a35c9;
  --glow:rgba(58,53,201,.10);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--bg);color:var(--ink);
  font-family:'Inter',-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;
  transition:background 1.2s ease,color 1.2s ease;
  overflow:hidden;
}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}

body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse 110% 70% at 50% 0%,var(--glow),transparent 65%);
  transition:background 1.2s ease;
}

body.sleep{--bg:#0c0e12;--ink:#f2f4f7;--ink-2:#9aa3af;--ink-3:#5f6874;--line:#242832;--accent:#8e8bff;--glow:rgba(142,139,255,.12)}

.top{
  position:relative;z-index:1;
  display:flex;justify-content:space-between;align-items:baseline;
  padding:26px clamp(20px,5vw,48px) 0;
}
.clock{font-size:clamp(15px,3vw,17px);font-weight:500;letter-spacing:-.02em;color:var(--ink-2)}
.date{font-size:12px;font-weight:500;color:var(--ink-3);letter-spacing:.01em}

main{
  position:relative;z-index:1;flex:1;
  display:flex;flex-direction:column;justify-content:center;
  padding:0 clamp(20px,5vw,48px);
  width:min(760px,100%);margin:0 auto;
}

.eyebrow{
  font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:500;
  letter-spacing:.24em;text-transform:uppercase;color:var(--ink-3);
  display:flex;align-items:center;gap:12px;
}
.eyebrow::after{content:"";flex:1;height:1px;background:var(--line)}

h1{
  font-family:'Instrument Serif',Georgia,serif;font-weight:400;
  font-size:clamp(40px,10vw,76px);line-height:1;letter-spacing:-.02em;
  margin:18px 0 0;max-width:16ch;
}
.note{font-size:14px;color:var(--ink-2);margin-top:14px;max-width:44ch}

.meta{
  display:flex;justify-content:space-between;align-items:baseline;
  gap:16px;flex-wrap:wrap;margin-top:30px;
}
.range{font-size:14px;color:var(--ink-2);letter-spacing:.02em}
.left{font-size:clamp(16px,3.6vw,20px);font-weight:700;color:var(--accent);letter-spacing:-.01em}

.track{height:2px;background:var(--line);margin-top:12px;position:relative;overflow:hidden}
.track i{
  position:absolute;inset:0 auto 0 0;display:block;
  background:var(--accent);transition:width .5s cubic-bezier(.4,0,.2,1);
}

.next{
  position:relative;z-index:1;
  border-top:1px solid var(--line);
  padding:22px clamp(20px,5vw,48px) 30px;
  width:min(760px,100%);margin:0 auto;
  display:flex;justify-content:space-between;align-items:flex-end;gap:16px;
}
.next-label{
  font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:500;
  letter-spacing:.24em;text-transform:uppercase;color:var(--ink-3);
}
.next-name{font-size:clamp(17px,4vw,21px);font-weight:600;letter-spacing:-.015em;margin-top:6px}
.next-time{font-size:15px;color:var(--ink-3);font-weight:500;white-space:nowrap}

@media (max-width:520px){
  h1{max-width:none}
  .meta{margin-top:22px}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none !important}
}
</style>
</head>
<body>

<div class="top">
  <div class="clock mono" id="clock">--:--:--</div>
  <div class="date" id="date">—</div>
</div>

<main>
  <div class="eyebrow" id="eyebrow">Agora</div>
  <h1 id="title">—</h1>
  <div class="note" id="note" style="display:none"></div>
  <div class="meta">
    <span class="range mono" id="range">--:-- – --:--</span>
    <span class="left mono" id="left">—</span>
  </div>
  <div class="track"><i id="bar" style="width:0%"></i></div>
</main>

<div class="next">
  <div>
    <div class="next-label">A seguir</div>
    <div class="next-name" id="nextName">—</div>
  </div>
  <div class="next-time mono" id="nextTime">--:--</div>
</div>

<script>
/* ─────────────────────────────────────────────
   FONTE ÚNICA — espelha a tabela do arquivo MD.
   Para alterar a rotina, edite APENAS este array.
   weekday: true = só de segunda a sexta
   ───────────────────────────────────────────── */
const ROTINA = [
  { ini:"04:30", fim:"05:00", nome:"Acordar", nota:"Banheiro · cama · roupa de treino" },
  { ini:"05:00", fim:"06:00", nome:"Treino" },
  { ini:"06:00", fim:"06:30", nome:"Banho e café" },
  { ini:"06:30", fim:"07:20", nome:"Bloco da manhã", nota:"50 min · Deep Work Ritual" },
  { ini:"07:30", fim:"12:15", nome:"Escola", nota:"Lanche na mochila ~10:00", weekday:true },
  { ini:"12:15", fim:"12:45", nome:"Almoço" },
  { ini:"12:45", fim:"13:00", nome:"Descanso" },
  { ini:"13:00", fim:"13:25", nome:"Tarefas de casa" },
  { ini:"13:30", fim:"18:00", nome:"Trabalho", nota:"Lanche 15:45", weekday:true },
  { ini:"18:05", fim:"18:20", nome:"Jantar e cozinha" },
  { ini:"18:25", fim:"19:45", nome:"Bloco da noite", nota:"80 min" },
  { ini:"19:45", fim:"19:55", nome:"Fechamento", nota:"Preparação do dia seguinte + revisão diária" },
  { ini:"19:55", fim:"20:25", nome:"Livre" },
  { ini:"20:30", fim:"24:00", nome:"Dormir", dormir:true }
];

const DIAS  = ["Domingo","Segunda","Terça","Quarta","Quinta","Sexta","Sábado"];
const MESES = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];

const min  = t => { const [h,m] = t.split(":").map(Number); return h*60+m; };
const pad  = n => String(n).padStart(2,"0");
const dur  = m => m >= 60 ? Math.floor(m/60)+"h "+pad(m%60)+"min" : m+" min";
const hhmm = t => t === "24:00" ? "00:00" : t;

function agenda(){
  const d = new Date().getDay();
  const util = d >= 1 && d <= 5;
  return ROTINA.filter(b => !b.weekday || util);
}

function tick(){
  const now  = new Date();
  const m    = now.getHours()*60 + now.getMinutes();
  const list = agenda();

  document.getElementById("clock").textContent =
    pad(now.getHours())+":"+pad(now.getMinutes())+":"+pad(now.getSeconds());
  document.getElementById("date").textContent =
    DIAS[now.getDay()]+", "+now.getDate()+" "+MESES[now.getMonth()];

  let atual = null, proximo = null;
  for (let i = 0; i < list.length; i++){
    const ini = min(list[i].ini);
    const fim = list[i].fim === "24:00" ? 1440 : min(list[i].fim);
    if (m >= ini && m < fim){ atual = list[i]; proximo = list[i+1] || list[0]; break; }
    if (m < ini){ proximo = list[i]; break; }
  }
  if (!proximo) proximo = list[0];

  document.body.classList.toggle("sleep", !!(atual && atual.dormir));

  const eyebrow = document.getElementById("eyebrow");
  const title   = document.getElementById("title");
  const note    = document.getElementById("note");
  const range   = document.getElementById("range");
  const left    = document.getElementById("left");
  const bar     = document.getElementById("bar");

  if (atual){
    const ini = min(atual.ini);
    const fim = atual.fim === "24:00" ? 1440 : min(atual.fim);
    eyebrow.textContent = atual.dormir ? "Dormir" : "Agora";
    title.textContent   = atual.nome;
    range.textContent   = atual.ini + " – " + hhmm(atual.fim);
    left.textContent    = "Faltam " + dur(fim - m);
    bar.style.width     = Math.min(100, ((m - ini)/(fim - ini))*100) + "%";
    if (atual.nota){ note.textContent = atual.nota; note.style.display = "block"; }
    else note.style.display = "none";
  } else {
    eyebrow.textContent = "Intervalo";
    title.textContent   = "Preparar: " + proximo.nome;
    range.textContent   = "Nenhum bloco ativo";
    left.textContent    = "Em " + dur(min(proximo.ini) - m);
    bar.style.width     = "0%";
    note.style.display  = "none";
  }

  const viraODia = m >= min(proximo.ini);
  document.getElementById("nextName").textContent = proximo.nome;
  document.getElementById("nextTime").textContent =
    (viraODia ? "Amanhã · " : "") + proximo.ini;
}

tick();
setInterval(tick, 1000);
</script>
</body>
</html>
